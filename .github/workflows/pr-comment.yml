# This is a basic workflow to help you get started with Actions

name: PR Bot

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "comment"
  comment:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    permissions:
      pull-requests: write
      contents: read

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: add comment
        uses: actions/github-script@v7
        env:
          API_URL: ${{secrets.URL_TEST}}
          API_TOKEN: ${{secrets.AUTH_TOKEN}}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;

            const url = process.env.API_URL;
            const token = process.env.API_TOKEN;

            if(!url){
              core.setFailed("api url이 없어욥");
              return;
            }

            // 변경 부분만 수집
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );

            // const changedFiles = files.map(f => ({
            //   filename: f.filename,
            //   status: f.status,           // added|modified|removed|renamed
            //   additions: f.additions,
            //   deletions: f.deletions,
            //   changes: f.changes,
            //   sha: f.sha,
            //   previous_filename: f.previous_filename || null,
            //   // GitHub가 주는 patch(해당 파일의 unified diff 일부/전체). 없을 수도 있습니다.
            //   patch: typeof f.patch === "string" ? f.patch : null
            // }));

            // 파일 본문을 base64로 가져오는 헬퍼
            async function getFileContentB64(ref, path) {
              try {
                // 우선 contents API 시도 (작은 파일에 유리)
                const { data } = await github.rest.repos.getContent({
                  owner, repo, path, ref,
                  headers: { Accept: "application/vnd.github.v3+json" }
                });
      
                // 디렉터리인 경우 skip
                if (Array.isArray(data) || data.type !== "file") {
                  return { ok: false, reason: "not-a-file" };
                }
      
                // 큰 파일이면 content가 없거나 truncate 될 수 있음 -> blob로 재시도
                if (!data.content || data.encoding !== "base64") {
                  // data.sha는 그 파일 blob sha
                  const blob = await github.rest.git.getBlob({ owner, repo, file_sha: data.sha });
                  return { ok: true, content_b64: blob.data.content, size: blob.data.size, sha: data.sha, from: "blob" };
                }
      
                // 정상 (<=1MB)
                return { ok: true, content_b64: data.content, size: data.size, sha: data.sha, from: "contents" };
              } catch (e) {
                // contents 실패 시 blob로 직접 시도 (경로->트리 경유는 비싸므로 여기선 생략)
                // 주로 파일이 매우 커서 contents가 실패한 케이스 처리
                core.info(`getContent 실패 ref=${ref} path=${path}: ${e.message}`);
                return { ok: false, reason: e.message };
              }
            }
      
            // 상태별로 필요한 ref/path 수집
            const tasks = [];
            for (const f of files) {
              const baseInfo = { ref: baseSha, path: f.previous_filename || f.filename };
              const headInfo = { ref: headSha, path: f.filename };
      
              if (f.status === "added" || f.status === "modified") {
                tasks.push({ kind: "current", ...headInfo, meta: f });
              } else if (f.status === "removed") {
                tasks.push({ kind: "previous", ...baseInfo, meta: f });
              } else if (f.status === "renamed") {
                // 둘 다 보내고 싶다면 둘 다 push
                tasks.push({ kind: "previous", ...baseInfo, meta: f });
                tasks.push({ kind: "current",  ...headInfo, meta: f });
              } else {
                // changed/copied 등 희귀 상태도 대비
                tasks.push({ kind: "current", ...headInfo, meta: f });
              }
            }
      
            // 병렬로 가져오기(속도 ↑). 너무 크면 rate-limit 고려해 배치 처리 가능.
            const results = await Promise.all(tasks.map(async (t) => {
              const r = await getFileContentB64(t.ref, t.path);
              return {
                ok: r.ok,
                reason: r.reason,
                kind: t.kind,                 // current/previous
                path: t.path,
                ref: t.ref,
                sha: r.sha ?? t.meta.sha,
                size: r.size ?? t.meta.changes, // size 정보 없으면 대충 변경 라인수라도
                status: t.meta.status,
                previous_filename: t.meta.previous_filename || null,
                additions: t.meta.additions,
                deletions: t.meta.deletions,
                content_b64: r.ok ? r.content_b64 : null,
                source: r.from ?? "unknown"
              };
            }));

            const payload = {
              meta: {
                owner,
                repo,
                prNumber,
                title: pr.title,
                head: { ref: pr.head.ref, sha: pr.head.sha },
                base: { ref: pr.base.ref, sha: pr.base.sha },
                author: pr.user.login,
                counts: {
                  files: files.length,
                  additions: files.reduce((s,f)=>s+f.additions,0),
                  deletions: files.reduce((s,f)=>s+f.deletions,0),
                }
              },
              files: results
            };

            const response = await fetch(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                ...(token ? { "Authorization": `Bearer ${token}` } : {})
              },
              body: JSON.stringify(payload)
            });

            if(!response.ok){
              core.setFailed(`API Faild: ${response.status} ${response.statusText}`);
              return;
            }

            let data = {};
            try {
              data = await response.json();
            } catch (e) {
              core.warning(`JSON 파싱 실패: ${e.message}`);
            }

            const comment = `
            <!--bot:pr-comment-->
            ### 자동 pr 코멘트 테스트!
            이것은 자동 pr 코멘트 테스트입니다
            
            - PR 제목: ${pr.title}
            - 브랜치: ${pr.head.ref} → ${pr.base.ref}
            - 작성자: @${pr.user.login}
            - 시간: ${data.time}
            `;

            core.info("코멘트를 검색합니다...");
            // 기존 코멘트 검색
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const exist = comments.find(c =>
              c.body?.includes('<!--bot:pr-comment-->')
            );

            if (exist){
              core.info("코멘트를 업데이트합니다...");
              await github.rest.issues.updateComment({
                comment_id: exist.id,
                owner: owner,
                repo: repo,
                body: comment,
              });
            }
            else {
              core.info("코멘트를 생성합니다...");
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: owner,
                repo: repo,
                body: comment,
              });
            }
            core.info("코멘트 완료!");
