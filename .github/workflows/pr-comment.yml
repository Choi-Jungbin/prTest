# This is a basic workflow to help you get started with Actions

name: PR Bot

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "comment"
  comment:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    permissions:
      pull-requests: write
      contents: read

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: add comment
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const prNumber = context.payload.pull_request.number;
            const repo = context.repo.repo;
            const owner = context.repo.owner;

            const comment = `
            <!--bot:pr-comment-->
            ### 자동 pr 코멘트 테스트!
            이것은 자동 pr 코멘트 테스트입니다
            
            - PR 제목: ${context.payload.pull_request.title}
            - 브랜치: ${context.payload.pull_request.head.ref} → ${context.payload.pull_request.base.ref}
            - 작성자: @${context.payload.pull_request.user.login}
            `;

            core.info("코멘트를 검색합니다...");
            // 기존 코멘트 검색
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const exist = comments.find(c =>
              c.body?.includes('<!--bot:pr-comment-->')
            );

            if (exist){
              core.info("코멘트를 업데이트합니다...");
              await github.rest.issues.updateComment({
                comment_id: exist.id,
                owner: owner,
                repo: repo,
                body: comment,
              });
            }
            else {
              core.info("코멘트를 생성합니다...");
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: owner,
                repo: repo,
                body: comment,
              });
            }
            core.info("코멘트 완료!");
